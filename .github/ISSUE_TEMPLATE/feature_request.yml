name: Feature Request
description: Suggest a new weapon, office room, corporate rank, or gameplay improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or idea
      description: What gameplay or UI improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should look or work in the game.
    validations:
      required: true
